<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tamaras webbplats om henne själv och hennes intresse för hundar.">
    <title>Kontakt | Tamaras värld</title>
    <style>
        :root {
            --bg: #fff8f5;
            --surface: #ffffff;
            --text: #2d2523;
            --accent: #b84f70;
            --accent-dark: #8e3653;
            --border: #ead8d2;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }
        header {
            background: var(--accent);
            color: #fff;
            padding: 1.5rem 1rem;
        }
        header h1 { margin: 0 0 0.75rem; }
        nav ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 0;
            padding: 0;
        }
        nav a {
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        nav a:hover, nav a:focus { text-decoration: underline; }
        main {
            width: min(100% - 2rem, 900px);
            margin: 2rem auto;
        }
        section {
            background: var(--surface);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 1rem 0;
        }
        .portrait { max-width: 430px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
        }
        .gallery figure { margin: 0; }
        figcaption { font-size: 0.95rem; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: #fff;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 0.75rem;
            text-align: left;
        }
        th { background: #f7e7ec; }
        form { max-width: 650px; }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: 700;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.35rem;
            border: 1px solid #bca9a4;
            border-radius: 6px;
            font: inherit;
        }
        textarea { min-height: 150px; resize: vertical; }
        fieldset {
            margin-top: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        fieldset label {
            display: inline-block;
            margin: 0.5rem 1rem 0.5rem 0;
            font-weight: 400;
        }
        fieldset input { width: auto; margin-right: 0.35rem; }
        button {
            margin-top: 1rem;
            padding: 0.75rem 1.25rem;
            border: 0;
            border-radius: 6px;
            background: var(--accent-dark);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover, button:focus { background: var(--accent); }
        footer {
            margin-top: 2rem;
            padding: 1.5rem 1rem;
            text-align: center;
            background: #2d2523;
            color: #fff;
        }
        footer a { color: #fff; }
        .external-link { font-weight: 700; }
    </style>
</head>
<body>
    <header>
        <h1>Tamaras värld</h1>
        <nav aria-label="Huvudmeny">
            <ul>
                <li><a href="index.html">Startsida</a></li>
                <li><a href="hobby.html">Min hobby</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        
<section>
    <h2>Kontakta mig</h2>
    <p>Har du en fråga eller vill du bara säga hej? Fyll gärna i formuläret nedan.</p>

    <form action="#" method="post">
        <label for="name">Namn</label>
        <input type="text" id="name" name="name" autocomplete="name" required>

        <label for="email">E-postadress</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <fieldset>
            <legend>Vad gäller ditt meddelande?</legend>
            <label for="question">
                <input type="radio" id="question" name="subject" value="fraga" required>
                Fråga
            </label>
            <label for="other">
                <input type="radio" id="other" name="subject" value="ovrigt">
                Övrigt
            </label>
        </fieldset>

        <label for="message">Meddelande</label>
        <textarea id="message" name="message" required></textarea>

        <label for="newsletter">
            <input type="checkbox" id="newsletter" name="newsletter" value="yes">
            Jag vill få information om nya inlägg.
        </label>

        <button type="submit">Skicka</button>
    </form>
</section>

<section>
    <h2>Alternativ kontaktväg</h2>
    <p>Du kan också nå mig direkt på
        <a href="mailto:tata2602@student.miun.se">tata2602@student.miun.se</a>.
    </p>
    
</section>

    </main>

    <footer>
        <p>&copy; 2026 Tamara | <a href="kontakt.html">Kontakta mig</a></p>
    </footer>
</body>
</html>
